name: Build Windows Flutter Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Desktop Release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Create Code Signing Certificate & Sign Binaries
        shell: pwsh
        run: |
          Write-Host "Creating Code Signing Certificate using Windows Cryptography Tools..."
          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject "CN=Voidflix, O=Voidflix Open Source, C=US" `
            -KeyUsage DigitalSignature `
            -FriendlyName "Voidflix Authenticode Certificate" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -NotAfter (Get-Date).AddYears(5)

          # Export public cert for Inno Setup installer packaging & website trust
          Export-Certificate -Cert $cert -FilePath "windows\Voidflix-Public.cer"
          Write-Host "Exported public certificate to windows\Voidflix-Public.cer"

          # Sign all executable binaries & dynamic libraries with SHA256 and DigiCert RFC 3161 Timestamping
          Get-ChildItem -Path "build\windows\x64\runner\Release\*.exe", "build\windows\x64\runner\Release\*.dll" | ForEach-Object {
            Write-Host "Signing $($_.Name)..."
            Set-AuthenticodeSignature -FilePath $_.FullName -Certificate $cert -TimestampServer "http://timestamp.digicert.com" -HashAlgorithm SHA256
          }

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Compile Inno Setup Installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows_setup.iss

      - name: Sign Inno Setup Installer
        shell: pwsh
        run: |
          $cert = Get-ChildItem "Cert:\CurrentUser\My" | Where-Object { $_.Subject -like "*CN=Voidflix*" } | Select-Object -First 1
          $installer = Get-ChildItem -Path "build\windows\installer\Voidflix-Setup-*.exe" | Select-Object -First 1
          if ($cert -and $installer) {
            Write-Host "Signing $($installer.FullName)..."
            Set-AuthenticodeSignature -FilePath $installer.FullName -Certificate $cert -TimestampServer "http://timestamp.digicert.com" -HashAlgorithm SHA256
          }

      - name: Package Standalone Zip
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath Voidflix-Windows-Portable.zip

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Voidflix-Windows-Setup
          path: build/windows/installer/Voidflix-Setup-*.exe

      - name: Upload Windows Portable Zip
        uses: actions/upload-artifact@v4
        with:
          name: Voidflix-Windows-Portable
          path: Voidflix-Windows-Portable.zip

      - name: Upload Public Certificate
        uses: actions/upload-artifact@v4
        with:
          name: Voidflix-Public-Certificate
          path: windows/Voidflix-Public.cer

      - name: Upload Raw Release Folder
        uses: actions/upload-artifact@v4
        with:
          name: Voidflix-Windows-Release-Binaries
          path: build/windows/x64/runner/Release/

      - name: Create or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $installer = (Get-ChildItem -Path "build\windows\installer\Voidflix-Setup-*.exe" | Select-Object -First 1).FullName
          gh release upload v1.0.2 $installer Voidflix-Windows-Portable.zip windows/Voidflix-Public.cer --clobber || gh release create v1.0.2 $installer Voidflix-Windows-Portable.zip windows/Voidflix-Public.cer --title "Voidflix v1.0.2" --notes "Official Native Windows Flutter Release v1.0.2 with stylized logos, white buffer seekbar and server lock." --clobber || true
