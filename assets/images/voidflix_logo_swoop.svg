</defs>

<!-- Pure Black Cinematic Canvas -->
<rect width="100%" height="100%" fill="#000000" />

<!-- 1. Wordmark VOIDFLIX revealed from behind the Swoop Mask -->
<g mask="url(#i4)" opacity="0" visibility="hidden" id="i14">
