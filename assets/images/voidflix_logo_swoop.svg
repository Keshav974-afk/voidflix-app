<!-- 2. The 3D Ribbon 'V' Monogram Swoop Animation -->
<g id="ribbon-v">
  <g transform="translate(256,256)">
    <!-- Swoop Translation: from center (256,256) to 'V' letter position (102.1, 256) -->
    <animateTransform repeatCount="indefinite" type="translate" attributeName="transform" dur="4.6s" begin="0s" calcMode="spline" values="256 256; 256 256; 102.1 256; 102.1 256" keyTimes="0; 0.376812; 0.560674; 1" keySplines="0 0 1 1; 0.684 0 0.455 1; 0 0 1 1" fill="freeze" />
    <!-- Swoop Scale: from hero size (0.66) to wordmark letter size (0.21) -->
    <g transform="scale(0.66,0.66)">
      <animateTransform repeatCount="indefinite" type="scale" attributeName="transform" dur="4.6s" begin="0s" calcMode="spline" values="0.66 0.66; 0.66 0.66; 0.21 0.21; 0.21 0.21" keyTimes="0; 0.166667; 0.376812; 1" keySplines="0 0 1 1; 0.655 0 0.461 1; 0 0 1 1" fill="freeze" />
      <g transform="translate(-0.209,-0.143)">
        <g opacity="0" id="ribbon-v-inner">
          <animate repeatCount="indefinite" attributeName="opacity" dur="4.6s" begin="0s" fill="freeze" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.05; 0.12; 0.58; 0.65; 1" keySplines="0 0 1 1; 0.333 0 0.667 1; 0 0 1 1; 0.612 0 1 1; 0 0 1 1" calcMode="spline" />
          
          <!-- Left Arm of 'V' (Dark Crimson Base Ribbon) -->
          <path fill="#b1060f" d="M-115,-218.21L-35,-218.21L12,218.52L-68,218.52Z">
            <animate repeatCount="indefinite" attributeName="d" dur="4.6s" begin="0s" calcMode="spline"
              values="M-115,-218.21L-35,-218.21L-35,-218.21L-115,-218.21Z;
                      M-115,-218.21L-35,-218.21L-35,-218.21L-115,-218.21Z;
                      M-115,-218.21L-35,-218.21L12,218.52L-68,218.52Z;
                      M-115,-218.21L-35,-218.21L12,218.52L-68,218.52Z"
              keyTimes="0; 0.04; 0.18; 1"
              keySplines="0 0 1 1; 0.434 0 0.252 1; 0 0 1 1"
              fill="freeze" />
          </path>

          <!-- Right Arm of 'V' (Foreground Bright Red Ribbon with Cast Shadow) -->
          <g filter="url(#f1)">
            <path fill="#e50914" d="M115,-218.21L35,-218.21L-12,218.52L68,218.52Z">
              <animate repeatCount="indefinite" attributeName="d" dur="4.6s" begin="0s" calcMode="spline"
                values="M115,-218.21L35,-218.21L35,-218.21L115,-218.21Z;
                        M115,-218.21L35,-218.21L35,-218.21L115,-218.21Z;
                        M115,-218.21L35,-218.21L-12,218.52L68,218.52Z;
                        M115,-218.21L35,-218.21L-12,218.52L68,218.52Z"
                keyTimes="0; 0.06; 0.22; 1"
                keySplines="0 0 1 1; 0.434 0 0.252 1; 0 0 1 1"
                fill="freeze" />
            </path>
          </g>

          <!-- Gloss Edge Highlight along Right Outer Border -->
          <line x1="115" y1="-218.21" x2="68" y2="218.52" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.32" />
        </g>
      </g>
    </g>
  </g>
</g>
