<svg fill="none" height="100%" width="100%" viewBox="0 0 512 512" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns="http://www.w3.org/2000/svg">
<defs>
  <filter filterUnits="userSpaceOnUse" height="200%" width="200%" y="-50%" x="-50%" id="f0">
