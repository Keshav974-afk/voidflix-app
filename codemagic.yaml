workflows:
  ios-release:
    name: Voidflix iOS Release (IPA for Sideloading & AltStore)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: master
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter dependencies
        script: |
          flutter packages pub get
      - name: Configure Flutter iOS assets and plugins
        script: |
          flutter build ios --config-only --release
      - name: Build unsigned iOS App via xcodebuild
        script: |
          xcodebuild build \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios_derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
      - name: Package Payload into Voidflix.ipa
        script: |
          mkdir -p Payload
          APP_PATH=$(find build/ios_derived/Build/Products/Release-iphoneos -name "*.app" | head -n 1)
          cp -r "$APP_PATH" Payload/Voidflix.app
          zip -r Voidflix.ipa Payload
    artifacts:
      - Voidflix.ipa
      - build/ios_derived/Build/Products/Release-iphoneos/*.app

  android-release:
    name: Voidflix Android Release APK
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: master
    scripts:
      - name: Get Flutter dependencies
        script: |
          flutter packages pub get
      - name: Build Split Release APK
        script: |
          flutter build apk --release --split-per-abi
    artifacts:
      - build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
      - build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
